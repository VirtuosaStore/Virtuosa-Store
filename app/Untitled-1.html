<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja Online</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
    header { background: #333; color: #fff; padding: 20px; text-align: center; }
    .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
    .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
    .product { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); }
    .product h2 { margin-top: 0; }
    .button { display: inline-block; margin-top: 12px; padding: 10px 16px; background: #007bff; color: #fff; text-decoration: none; border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>Loja Online</h1>
  </header>
  <div class="container">
    <p>Bem-vindo à nossa loja online. Encontre produtos selecionados e compre com facilidade.</p>
    <section class="products">
      <article class="product">
        <h2>Produto 1</h2>
        <p>Descrição breve do produto.</p>
        <a href="#" class="button">Comprar</a>
      </article>
      <article class="product">
        <h2>Produto 2</h2>
        <p>Descrição breve do produto.</p>
        <a href="#" class="button">Comprar</a>
      </article>
      <article class="product">
        <h2>Produto 3</h2>
        <p>Descrição breve do produto.</p>
        <a href="#" class="button">Comprar</a>
      </article>
    </section>
  </div>
</body>
</html>r
